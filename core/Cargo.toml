[package]
name = "activity-core"
version = "2.0.0"
edition = "2021"
rust-version = "1.77.2"
description = "Activity Tracker logic that does not depend on Tauri: SQL, export, settings keys, icon lookup"
license = "MIT"

# Deliberately no tauri, no webview2, no window toolkit. A test binary built from this crate loads and runs on this
# machine; one that links the Tauri stack does not (D-057, L-11).

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
once_cell = "1.19"
rusqlite = { version = "0.35", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.33"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# Only what resolving a Start Menu shortcut needs: IShellLinkW + IPersistFile, and CoCreateInstance.
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }
